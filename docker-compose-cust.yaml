version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: taiga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: taiga123
      POSTGRES_DB: taiga
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taiga -d taiga"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: taiga-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  taiga-back:
    image: taigaio/taiga-back:latest
    container_name: taiga-back
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TAIGA_SECRET_KEY=k2jptq=mpxa@*h10)*0g5xeo7ikc#&^pqfn7$nz8h5%4493v$i
      - TAIGA_SITES_SCHEME=https
      - TAIGA_SITES_DOMAIN=work.techsed.com
      - POSTGRES_USER=taiga
      - POSTGRES_PASSWORD=taiga123
      - POSTGRES_DB=taiga
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - taiga_media_data:/taiga/media
      - taiga_static_data:/taiga/static
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  taiga-front:
    image: taigaio/taiga-front:latest
    container_name: taiga-front
    restart: unless-stopped
    depends_on:
      - taiga-back
    environment:
      - TAIGA_HOST=taiga-back
    networks:
      - coolify
    # PORT EXPOSE MAT KAREIN - Nginx handle karega

  nginx:
    image: nginx:alpine
    container_name: taiga-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - taiga-back
      - taiga-front
    networks:
      - coolify

volumes:
  postgres_data:
  redis_data:
  taiga_media_data:
  taiga_static_data:

networks:
  coolify:
    external: true
